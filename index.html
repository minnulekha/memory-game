<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Team Project</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Load Supabase from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Entry point module -->
    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <!-- Premium Landing Page / Nickname Entry -->
    <div id="nickname-modal" class="modal active">
        <div class="modal-content landing-content">
            <div class="landing-header">
                <h1 class="game-title">✨ Memory Raid ✨</h1>
                <p class="game-subtitle">Train your brain. Beat the clock. Claim the top spot.</p>
            </div>
            
            <div class="landing-actions">
                <div class="input-group">
                    <label for="nickname-input">Ready to play?</label>
                    <input type="text" id="nickname-input" placeholder="Enter your nickname" maxlength="15">
                </div>
                
                <div class="button-group">
                    <button id="start-btn">▶ Start Game</button>
                    <!-- New front-page leaderboard button -->
                    <button id="landing-leaderboard-btn" class="btn-secondary">🏆 Leaderboard</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game UI -->
    <div id="game-container" class="hidden">
        <header id="stats-header">
            <div class="stat">Moves: <span id="moves-count">0</span></div>
            <div class="stat">Time: <span id="timer-count">0</span>s</div>
            <div class="stat">Lives: <span id="lives-count">3</span></div>
        </header>

        <main id="game-board" class="grid-4x4"></main>
        
        <!-- Action Buttons properly grouped -->
        <div class="action-buttons">
            <button id="restart-btn" class="hidden">Play Again</button>
            <button id="show-leaderboard-btn">🏆 Leaderboard</button>
        </div>
    </div>

    <!-- Game Over / Win Modal -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title">Game Over</h2>
            <p id="result-message"></p>
            
            <div id="leaderboard-section">
                <h3>Top Scores</h3>
                <ul id="leaderboard-list">
                    <li>Loading...</li>
                </ul>
            </div>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Standalone Leaderboard Modal -->
    <div id="leaderboard-only-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🏆 Top Scores</h2>
            <ul id="leaderboard-only-list">
                <li>Loading...</li>
            </ul>
            <button id="close-leaderboard-btn" style="margin-top: 15px;">Close</button>
        </div>
    </div>
</body>
</html>
